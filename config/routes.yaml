controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app_products_show:
    path: /products/{id}
    controller: App\Controller\ProductsController::show
    requirements:
        id: \d+

well_known_ignore:
    path: /.well-known/{any}
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /
        permanent: false
    requirements:
        any: .*